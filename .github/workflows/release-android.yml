name: Release to Google Play

# Run it by hand for every Play build: Actions -> Release to Google Play -> Run
# workflow, and pick the track. The version name is <major>.<commits on main>,
# with the major number from majorVersion in android/app/build.gradle.kts, the
# same version the TestFlight job gives the same commit. The version code is
# 10 × run number + attempt, so every upload and every re-run is higher.
#
# After a successful upload the tag job marks the commit as android-v<version>.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to release to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: >-
          completed rolls the release out on the track. draft only prepares it
          in the Play Console, which the API insists on for an app that has
          never been published in production.
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    # GitHub-hosted, like CI. Only a manual dispatch starts this job, and
    # secrets are never handed to a workflow triggered from a fork, so the
    # upload key stays out of reach of anyone opening a pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      version: ${{ steps.version.outputs.name }}

    defaults:
      run:
        working-directory: android

    steps:
      # The whole history: the version counts the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          major=$(sed -n 's/^val majorVersion = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$major" ]; then
            echo "::error::No majorVersion found in android/app/build.gradle.kts."
            exit 1
          fi

          # A shallow clone would count one commit and ship 1.1 forever.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::error::The checkout is shallow; the version needs the full history (fetch-depth: 0)."
            exit 1
          fi
          name="$major.$(git rev-list --count HEAD)"

          # Play rejects a versionCode that is not higher than every earlier
          # upload, including the manual first one (1). Ten per run leaves room
          # for re-running a failed attempt of the same run.
          code=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Shipping $name (versionCode $code)"

      # Said out loud before twenty minutes of building, not as a cryptic
      # Gradle error at the end.
      - name: Check the secrets are there
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for pair in "ANDROID_UPLOAD_KEYSTORE:$KEYSTORE" "ANDROID_UPLOAD_STORE_PASSWORD:$STORE_PASSWORD" "PLAY_SERVICE_ACCOUNT_JSON:$SERVICE_ACCOUNT"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::Repository secret ${pair%%:*} is not set."
              missing=1
            fi
          done
          exit $missing

      # The shared CSV replays hold the detector to the same counts as iOS; a
      # release that miscounts is worse than no release.
      - name: Test
        run: ./gradlew :core:test :app:testDebugUnitTest

      # After the tests, so the key sits on the runner only as long as needed.
      # Its path goes to the build step alone: the Gradle build refuses a
      # keystore without its password, and a job-wide path once made the test
      # step fail on exactly that.
      - name: Install the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle
        env:
          CINDY_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          CINDY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CINDY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CINDY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          CINDY_VERSION_CODE: ${{ steps.version.outputs.code }}
          CINDY_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:bundleRelease

      # An unsigned or wrongly signed bundle is only rejected by Play after the
      # upload. The fingerprint must match the upload key in the Play Console
      # (Test and release › App integrity › App signing).
      - name: Check the bundle is signed with the upload key
        run: |
          bundle=app/build/outputs/bundle/release/app-release.aab
          if ! jarsigner -verify "$bundle" | grep -q "jar verified"; then
            jarsigner -verify "$bundle" || true
            echo "::error::$bundle is not signed."
            exit 1
          fi
          keytool -printcert -jarfile "$bundle" | grep -E "SHA256:"

      # The privacy policy promises no network access. A library update can
      # merge the INTERNET permission back in without anyone noticing, and
      # Play would then list it on the store page.
      - name: Check the app still has no network permission
        run: |
          manifest=$(find app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          if [ -z "$manifest" ]; then
            echo "::error::Merged release manifest not found."
            exit 1
          fi
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)"' "$manifest"; then
            echo "::error::The release manifest requests network access — see the tools:node=\"remove\" entries in AndroidManifest.xml."
            exit 1
          fi
          echo "No network permission in $manifest"

      - name: Upload to Google Play
        # Pinned to the v1.1.5 commit: this third-party action receives the
        # service account key, so a moved tag must not change what runs.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.raddatz.cindy
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          # Lets the Play Console de-obfuscate crash reports from R8-shrunk builds.
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      # Runs even when a step above failed, so no key is left on the runner.
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  tag:
    # Marks the commit that just went to the store, so git shows what shipped
    # when. A job of its own: only these few lines hold a token that can write
    # to the repository, not the job running the build tools and the
    # third-party upload action. A tag created with this token starts no
    # workflow.
    needs: play
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v${{ needs.play.outputs.version }}
        run: |
          # The same state uploaded again (a new build of the same version)
          # keeps its first tag instead of failing the run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; left as it is."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG"
