name: Release to TestFlight

# iOS only; Android ships through release-android.yml.

# Run it by hand for every TestFlight build: Actions -> Release to TestFlight
# -> Run workflow. The version is <major>.<commits on main>, with the major
# number from MARKETING_VERSION in project.yml, so every new state of main is a
# new, higher version on its own and the same state is the same version on iOS
# and Android. The build is 10 × run number + attempt, unique even when the same
# state is uploaded twice or a run is re-run. Every new version goes through a
# Beta App Review before external testers get it; internal testers do not wait.
#
# After a successful upload the tag job marks the commit as ios-v<version>.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    # GitHub-hosted, like CI. Only a manual dispatch starts this job, and
    # secrets are never handed to a workflow triggered from a fork, so the
    # signing material stays out of reach of anyone opening a pull request.
    runs-on: macos-26
    timeout-minutes: 90

    outputs:
      version: ${{ steps.version.outputs.marketing }}

    env:
      # Not a secret: it is in project.yml and in every built binary.
      TEAM_ID: MDQY93XVHF

    # The Xcode project lives in ios/, next to android/.
    defaults:
      run:
        working-directory: ios

    steps:
      # The whole history: the version counts the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is too old — project.yml declares xcodeVersion 26."
            exit 1
          fi

      - name: Work out the version
        id: version
        run: |
          marketing=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)
          major="${marketing%%.*}"
          if [ -z "$major" ]; then
            echo "::error::No MARKETING_VERSION found in project.yml."
            exit 1
          fi

          # A shallow clone would count one commit and ship 1.1 forever.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::error::The checkout is shallow; the version needs the full history (fetch-depth: 0)."
            exit 1
          fi
          # Only ever grows, unless main's history is rewritten — App Store
          # Connect would then reject the lower version.
          version="$major.$(git rev-list --count HEAD)"

          # Unique within the version even when the same state is uploaded
          # twice, and for up to nine attempts of one run.
          build=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))

          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Shipping $version (build $build)"

      # A keychain of its own, thrown away at the end. Importing into the
      # login keychain would leave the signing identity on a machine that is
      # recycled anyway, and would prompt.
      - name: Install the signing certificates
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          import_p12() {
            echo "$2" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" \
              -k "$keychain" -P "$3" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm "$RUNNER_TEMP/cert.p12"
            echo "imported $1"
          }

          import_p12 "Apple Distribution" "$DIST_CERT_P12" "$DIST_CERT_PASSWORD"
          import_p12 "Apple Development" "$DEV_CERT_P12" "$DEV_CERT_PASSWORD"

          # Say what actually landed, so a wrong or key-less .p12 is caught
          # here rather than forty minutes later in the export step. Printing
          # is not enough: `find-identity` reports "0 valid identities found"
          # and still exits 0, so the count has to be asserted.
          security find-identity -v "$keychain"
          for kind in "Apple Distribution" "Apple Development"; do
            if ! security find-identity -v "$keychain" | grep -q "$kind"; then
              echo "::error::No $kind identity in the keychain — the matching" \
                   "secret is not a .p12 containing both certificate and private key."
              exit 1
            fi
          done

          # Without this codesign stops to ask for permission it cannot get.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null

          # Put it in the search list, or xcodebuild will not look in it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # xcodebuild uses this to fetch and, if need be, create the provisioning
      # profile, and to do the upload at the end.
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      # An upload needs an app record in App Store Connect; without one the
      # export step fails with "Error Downloading App Information", which names
      # neither the app nor the reason. Ask first, and say what was found.
      # Never fatal: this is a diagnosis, and `--list-apps` is not worth a
      # failed release of its own.
      - name: Check the app exists in App Store Connect
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          bundle_id=$(sed -n 's/^ *PRODUCT_BUNDLE_IDENTIFIER: *\(.*\)$/\1/p' project.yml | head -1)
          echo "Looking for $bundle_id"
          apps=$(xcrun altool --list-apps --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          echo "$apps"
          if ! printf '%s' "$apps" | grep -qF "$bundle_id"; then
            echo "::warning::$bundle_id is not among the apps this key can see." \
                 "Create the app record in App Store Connect, or check the key is App Manager."
          fi

      - name: Generate the project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      # Uploading straight from the export step, so no separate altool call
      # and no intermediate .ipa to keep track of.
      - name: Write the export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>TEAM_ID_PLACEHOLDER</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Cindy.xcodeproj \
            -scheme Cindy \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cindy.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            | xcbeautify --renderer github-actions

      # The manifest is picked up implicitly, because it sits inside the
      # sources path. Implicit means it can silently stop being copied, and
      # App Store Connect only complains by e-mail hours later.
      - name: Check the privacy manifest made it into the bundle
        run: |
          app="$RUNNER_TEMP/Cindy.xcarchive/Products/Applications/Cindy.app"
          if [ ! -f "$app/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy is missing from the built app."
            exit 1
          fi
          plutil -lint "$app/PrivacyInfo.xcprivacy"

      # Cindy is iPhone-only, and XcodeGen's target preset quietly made it
      # universal once. App Store Connect only noticed at upload, as an
      # orientation error about iPad multitasking; this notices before.
      - name: Check the app is iPhone-only
        run: |
          app="$RUNNER_TEMP/Cindy.xcarchive/Products/Applications/Cindy.app"
          family=$(plutil -extract UIDeviceFamily json -o - "$app/Info.plist")
          if [ "$family" != "[1]" ]; then
            echo "::error::UIDeviceFamily is $family, expected [1] — TARGETED_DEVICE_FAMILY in project.yml."
            exit 1
          fi

      - name: Export and upload
        # `IDEDistribution` drops its log bundle in TMPDIR, which is a random
        # path under /var/folders. Point it somewhere known so the step below
        # can pick the logs up without searching the whole runner.
        env:
          TMPDIR: ${{ runner.temp }}/distlogs
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cindy.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | xcbeautify --renderer github-actions

      # `xcodebuild` writes Apple's actual answer into an .xcdistributionlogs
      # bundle in a temporary directory and the runner takes it to the grave.
      # The step above only prints the one-line summary, which for a missing
      # app record is "Error Downloading App Information" and nothing else.
      - name: Keep the distribution logs when the upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcdistributionlogs
          path: ${{ runner.temp }}/distlogs/**/*.xcdistributionlogs/**
          if-no-files-found: warn
          retention-days: 7

      # Runs even when the archive failed, so a broken run leaves no identity
      # behind on the runner.
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$RUNNER_TEMP/private_keys"

  tag:
    # Marks the commit that just went to the store, so git shows what shipped
    # when. A job of its own: only these few lines hold a token that can write
    # to the repository, not the job running the build tools and the
    # third-party upload action. A tag created with this token starts no
    # workflow.
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-v${{ needs.testflight.outputs.version }}
        run: |
          # The same state uploaded again (a new build of the same version)
          # keeps its first tag instead of failing the run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; left as it is."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG"
