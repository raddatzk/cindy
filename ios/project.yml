name: Cindy
options:
  bundleIdPrefix: me.raddatz
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions: [en, de]

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    # `complete` is the goal; the camera path still trips it and is the one
    # part never run on real hardware, so it is left for after the device
    # test. `targeted` holds everything already cleaned up.
    SWIFT_STRICT_CONCURRENCY: targeted
    # Makes key path literals sendable, as the Swift 6 language mode does.
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MDQY93XVHF
    # Only the major number is maintained here. The TestFlight job ships
    # <major>.<commits on main> as the version and 10 × run number + attempt
    # as the build; local builds are simply 1.0 (1).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Cindy:
    type: application
    platform: iOS
    sources:
      - path: Cindy
    info:
      path: Cindy/Info.plist
      properties:
        CFBundleDisplayName: Cindy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - me.raddatz.cindy.refresh
        NSCameraUsageDescription: "Cindy uses the front camera to count reps during calibration and your workout. Frames are analyzed on device only, and are neither stored nor transmitted."
        NSHealthUpdateUsageDescription: "Cindy writes your finished workouts to Apple Health so they show up in Fitness next to your other training."
        NSHealthShareUsageDescription: "Cindy reads your sleep, resting pulse, heart rate variability and body weight to estimate how ready you are for the next workout. Nothing else is read, and the values stay on the device."
    entitlements:
      path: Cindy/Cindy.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.cindy
        # Repeated from the project settings on purpose. XcodeGen's preset for
        # an iOS application sets "1,2" at target level, which outranks the
        # project level, so the "1" up there never reached the build. A
        # universal build is rejected on upload for its portrait-only
        # orientation (iPad multitasking wants all four), and would put the
        # app under iPad review and require iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  CindyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CindyTests
      # Recorded and synthetic signal logs, shared with the Android unit tests
      # so both detectors are held to the same rep counts.
      - path: ../shared/fixtures
        buildPhase: resources
    dependencies:
      - target: Cindy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.cindy.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Cindy:
    build:
      targets:
        Cindy: all
        CindyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CindyTests
    profile:
      config: Release
    archive:
      config: Release
